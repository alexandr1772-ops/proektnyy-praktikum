name: API and Docker checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run API tests
        working-directory: backend
        run: python -m pytest -q tests --cov=app --cov-report=term-missing --cov-fail-under=40

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set a disposable demo admin password
        run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          echo "ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start API and PostgreSQL
        run: docker compose up --build --detach

      - name: Verify API and seeded database
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/db > health.json; then
              python - <<'PY'
          import json
          with open("health.json", encoding="utf-8") as response:
              data = json.load(response)
          assert data["database"] == "connected"
          assert data["students"] >= 2
          assert data["lessons"] >= 2
          assert data["attendance"] >= 1
          PY
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Test sprint 2 demo on PostgreSQL
        working-directory: backend
        env:
          SPRINT2_E2E_BASE_URL: http://127.0.0.1:8000
        run: python -m pytest -q e2e

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
